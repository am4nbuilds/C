<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Deposit - ElitePros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
   <style>
    :root {
        --bg-dark: #0b1020;
        --card-bg: #1f2340;
        --card-dark: #121322;
        --accent: #3f3ef2;
        --muted: #9aa3b2;
        --success: #10b981;
        --warning: #f59e0b;
        --deposit-color: #f59e0b;
        --winnings-color: #10b981;
        --balance-color: #3f3ef2;
    }
    
    body {
        background: var(--bg-dark);
        color: white;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        margin: 0;
        padding: 0;
        padding-bottom: 20px;
    }
    
    /* Header - Like Wallet Page */
    .header-bar {
        background: var(--card-dark);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        position: relative;
    }

    .centered-logo-inline-container {
        display: flex;
        align-items: center;
        gap: 12px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }

    .app-logo-header {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(99, 102, 241, 0.5);
        flex-shrink: 0;
    }

    .centered-logo-inline-label {
        font-weight: 800;
        font-size: 18px;
        background: linear-gradient(135deg, #fff, #a5b4fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        white-space: nowrap;
    }

    .back-btn {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        flex-shrink: 0;
    }

    .back-btn:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    
    /* Messages */
    .message-container {
        padding: 0 16px;
        margin-top: 12px;
    }
    
    .error-message,
    .success-message {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        margin-bottom: 12px;
        animation: slideIn 0.3s ease;
    }
    
    .error-message {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
    }
    
    .success-message {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #4ade80;
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Deposit Section */
    .deposit-section {
        padding: 16px;
    }
    
    .deposit-card {
        background: linear-gradient(135deg, var(--card-bg), var(--card-dark));
        border-radius: 20px;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .deposit-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
    }
    
    .deposit-icon {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--warning), #d97706);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
    }
    
    .deposit-header-text {
        flex: 1;
    }
    
    .deposit-title {
        font-weight: 800;
        font-size: 22px;
        margin-bottom: 4px;
    }
    
    .deposit-subtitle {
        color: var(--muted);
        font-size: 14px;
    }
    
    /* Deposit Amounts Grid */
    .deposit-amounts-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 24px;
    }
    
    .deposit-amount-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 20px 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        user-select: none;
    }
    
    .deposit-amount-card:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-2px);
    }
    
    .deposit-amount-card.selected {
        background: linear-gradient(135deg, var(--warning), #d97706);
        border-color: transparent;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
    }
    
    .amount-display {
        font-weight: 800;
        font-size: 24px;
        margin-bottom: 6px;
    }
    
    .amount-bonus {
        font-size: 12px;
        color: var(--muted);
    }
    
    .deposit-amount-card.selected .amount-bonus {
        color: white;
        opacity: 0.9;
    }
    
    /* Skeleton Loading */
    .skeleton-shimmer {
        background: linear-gradient(90deg, 
            rgba(255, 255, 255, 0.05) 25%, 
            rgba(255, 255, 255, 0.1) 50%, 
            rgba(255, 255, 255, 0.05) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 14px;
    }
    
    .skeleton-deposit-amount {
        height: 100px;
    }
    
    @keyframes shimmer {
        0% {
            background-position: -200% 0;
        }
        100% {
            background-position: 200% 0;
        }
    }
    
    /* Deposit Button */
    .deposit-btn-container {
        padding: 16px;
        padding-bottom: 30px;
    }
    
    .deposit-btn {
        width: 100%;
        background: linear-gradient(135deg, var(--accent), #6366f1);
        border: none;
        border-radius: 14px;
        padding: 20px;
        color: white;
        font-weight: 700;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .deposit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
    }
    
    .deposit-btn:not(:disabled):hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(63, 62, 242, 0.3);
    }
    
    .deposit-btn.glow {
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0%, 100% {
            box-shadow: 0 0 20px rgba(63, 62, 242, 0.5);
        }
        50% {
            box-shadow: 0 0 30px rgba(63, 62, 242, 0.8);
        }
    }
    
    /* Payment Modal */
    .payment-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        display: none;
    }

    .payment-modal-content {
        background: linear-gradient(135deg, #1f2340, #121322);
        border-radius: 28px;
        padding: 28px 24px;
        width: 90%;
        max-width: 400px;
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .modal-title {
        font-weight: 800;
        font-size: 22px;
        background: linear-gradient(135deg, #fff, #c084fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .close-modal {
        background: rgba(255,255,255,0.1);
        border: none;
        color: #cbd5e1;
        width: 36px;
        height: 36px;
        border-radius: 40px;
        font-size: 1.4rem;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-modal:hover {
        background: rgba(255,255,255,0.2);
        color: white;
        transform: scale(1.02);
    }

    .payment-amount-display {
        text-align: center;
        margin-bottom: 28px;
        background: rgba(0,0,0,0.3);
        padding: 16px;
        border-radius: 24px;
    }

    .payment-label {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }

    .payment-value {
        font-weight: 800;
        font-size: 38px;
        color: #fbbf24;
        text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .payment-instructions {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 18px;
        margin-bottom: 28px;
        border: 1px solid rgba(255,215,0,0.2);
    }

    .instruction-item {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        font-size: 14px;
        color: #e2e8f0;
    }

    .instruction-item:last-child {
        margin-bottom: 0;
    }

    .instruction-number {
        width: 26px;
        height: 26px;
        border-radius: 30px;
        background: linear-gradient(135deg, #f59e0b, #d97706);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        flex-shrink: 0;
        color: white;
    }

    .modal-actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }

    .modal-btn {
        flex: 1;
        padding: 16px;
        border-radius: 40px;
        border: none;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .modal-btn.primary {
        background: linear-gradient(135deg, #f59e0b, #ea580c);
        color: white;
        box-shadow: 0 6px 14px rgba(245,158,11,0.3);
    }

    .modal-btn.primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 22px rgba(245,158,11,0.4);
    }
    
    .modal-btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
    }
    
    .loading-spinner-inline {
        animation: spin 1s linear infinite;
        margin-right: 6px;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    /* hidden dynamic form */
    .hidden-dynamic-form {
        display: none;
    }
</style>
</head>

<body>
    <!-- Header -->
    <div class="header-bar">
        <button class="back-btn" id="backButton">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        
        <div class="centered-logo-inline-container">
            <div class="app-logo-header">
                <img id="appLogo" src="http://elitepros.wuaze.com/IMG-20250106-WA0000.jpg" alt="ElitePros" style="width:100%;height:100%;object-fit:cover;">
            </div>
            <div class="centered-logo-inline-label">Deposit</div>
        </div>
        
        <div style="width:44px;"></div>
    </div>

    <!-- Messages -->
    <div class="message-container">
        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText"></span>
        </div>
        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i>
            <span id="successText"></span>
        </div>
    </div>

    <!-- Deposit Card -->
    <div class="deposit-section">
        <div class="deposit-card">
            <div class="deposit-header">
                <div class="deposit-icon">
                    <i class="fa-solid fa-piggy-bank"></i>
                </div>
                <div class="deposit-header-text">
                    <div class="deposit-title">Select Deposit Amount</div>
                    <div class="deposit-subtitle">Choose amount & proceed to secure payment</div>
                </div>
            </div>
            
            <div id="depositAmountsLoading">
                <div class="deposit-amounts-grid">
                    <div class="skeleton-shimmer skeleton-deposit-amount"></div>
                    <div class="skeleton-shimmer skeleton-deposit-amount"></div>
                    <div class="skeleton-shimmer skeleton-deposit-amount"></div>
                    <div class="skeleton-shimmer skeleton-deposit-amount"></div>
                </div>
            </div>
            
            <div id="depositAmountsContent" style="display: none;">
                <div id="depositAmountsGrid" class="deposit-amounts-grid"></div>
            </div>
        </div>
    </div>

    <!-- Deposit Button -->
    <div class="deposit-btn-container">
        <button id="depositBtn" class="deposit-btn" disabled>
            <i class="fa-solid fa-circle-arrow-right"></i>
            <span>Select Amount</span>
        </button>
    </div>

    <!-- Payment Modal (Simplified: only confirmation + hidden form) -->
    <div id="paymentModal" class="payment-modal">
        <div class="payment-modal-content">
            <div class="modal-header">
                <div class="modal-title">Confirm Payment</div>
                <button class="close-modal" id="closeModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="payment-amount-display">
                <div class="payment-label">Amount to Pay</div>
                <div id="paymentAmountValue" class="payment-value">₹0</div>
            </div>
            
            <div class="payment-instructions">
                <div class="instruction-item">
                    <div class="instruction-number">1</div>
                    <div>Verify deposit amount</div>
                </div>
                <div class="instruction-item">
                    <div class="instruction-number">2</div>
                    <div>Click "Pay Now" – secure gateway</div>
                </div>
                <div class="instruction-item">
                    <div class="instruction-number">3</div>
                    <div>Complete payment & get credited instantly</div>
                </div>
            </div>
            
            <div class="modal-actions">
                <button id="payNowBtn" class="modal-btn primary">
                    <i class="fa-solid fa-credit-card"></i> Pay Now
                </button>
            </div>
        </div>
    </div>
    
    <!-- Hidden POST form to PHP endpoint (no fetch API) -->
    <form id="phpDepositForm" method="POST" action="deposit.php" style="display: none;">
        <input type="hidden" name="amount" id="formAmount">
        <input type="hidden" name="idToken" id="formIdToken">
    </form>

<script>
/* =====================================
   FIREBASE INIT (AUTH ONLY)
   ===================================== */
const firebaseConfig = {
  apiKey: "AIzaSyC86fii3isDnSOof71h_18PdZehzCEFIFw",
  authDomain: "eliteprosofficial.firebaseapp.com",
  databaseURL: "https://eliteprosofficial-default-rtdb.firebaseio.com",
  projectId: "eliteprosofficial",
  storageBucket: "eliteprosofficial.firebasestorage.app",
  messagingSenderId: "646561207100",
  appId: "1:646561207100:web:47de7b648695367e208439"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* =====================================
   GLOBAL STATE
   ===================================== */
let currentUser = null;
let currentIdToken = null;
let selectedAmount = 0;

/* =====================================
   UI Helpers
   ===================================== */
function showErrorMessage(msg) {
    const errorDiv = document.getElementById("errorMessage");
    const errorSpan = document.getElementById("errorText");
    errorSpan.innerText = msg;
    errorDiv.style.display = "flex";
    setTimeout(() => {
        errorDiv.style.display = "none";
    }, 5000);
}

function showSuccessMessage(msg) {
    const successDiv = document.getElementById("successMessage");
    const successSpan = document.getElementById("successText");
    successSpan.innerText = msg;
    successDiv.style.display = "flex";
    setTimeout(() => {
        successDiv.style.display = "none";
    }, 4000);
}

/* =====================================
   AUTH & LOAD DEPOSIT AMOUNTS (unchanged flow)
   ===================================== */
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
  
  try {
    currentIdToken = await user.getIdToken();
  } catch (err) {
    console.error("Token error:", err);
    showErrorMessage("Authentication error. Please refresh.");
    return;
  }
  
  await loadDepositAmountsFromBackend();
});

async function loadDepositAmountsFromBackend() {
  try {
    if (!currentIdToken) throw new Error("No token");
    
    // Keep using same backend endpoint but only for amounts (no payment creation)
    const response = await fetch("https://elitepros-backend.onrender.com/api/deposit-options", {
      method: "GET",
      headers: { 
        "Authorization": `Bearer ${currentIdToken}`,
        "Content-Type": "application/json"
      }
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const data = await response.json();
    let amounts = [];
    if (Array.isArray(data)) {
      amounts = data.filter(amt => typeof amt === 'number' && amt > 0);
    } else if (data.amounts && Array.isArray(data.amounts)) {
      amounts = data.amounts.filter(amt => typeof amt === 'number' && amt > 0);
    } else if (data.data && Array.isArray(data.data)) {
      amounts = data.data.filter(amt => typeof amt === 'number' && amt > 0);
    }
    
    amounts.sort((a,b) => a - b);
    if (amounts.length === 0) amounts = [100, 250, 500, 1000];
    
    displayDepositAmounts(amounts);
  } catch (error) {
    console.warn("Fallback to default amounts:", error);
    displayDepositAmounts([100, 250, 500, 1000]);
  }
}

function displayDepositAmounts(amounts) {
  const container = document.getElementById('depositAmountsGrid');
  container.innerHTML = '';
  
  amounts.forEach((amount) => {
    const amountCard = document.createElement('div');
    amountCard.className = 'deposit-amount-card';
    amountCard.dataset.amount = amount;
    amountCard.onclick = () => selectAmount(amount);
    amountCard.innerHTML = `
      <div class="amount-display">₹${amount}</div>
      <div class="amount-bonus">Deposit Amount</div>
    `;
    container.appendChild(amountCard);
  });
  
  document.getElementById('depositAmountsLoading').style.display = 'none';
  document.getElementById('depositAmountsContent').style.display = 'block';
}

function selectAmount(amount) {
  selectedAmount = amount;
  document.querySelectorAll(".deposit-amount-card").forEach(card => {
    const cardAmount = parseInt(card.dataset.amount);
    if (cardAmount === amount) card.classList.add("selected");
    else card.classList.remove("selected");
  });
  
  const btn = document.getElementById("depositBtn");
  btn.disabled = false;
  btn.classList.add("glow");
  btn.innerHTML = `<i class="fa-solid fa-credit-card"></i> Pay ₹${selectedAmount}`;
}

/* =====================================
   MODAL & PHP FORM SUBMISSION (NO FETCH, NO localStorage)
   ===================================== */
document.getElementById("depositBtn").onclick = () => {
  if (!selectedAmount) {
    alert("Please select an amount first");
    return;
  }
  // update modal display
  document.getElementById("paymentAmountValue").innerText = `₹${selectedAmount}`;
  document.getElementById("paymentModal").style.display = "flex";
};

document.getElementById("closeModal").onclick = () => {
  document.getElementById("paymentModal").style.display = "none";
  // reset any button state inside modal (no fetch, just reset)
  const payBtn = document.getElementById("payNowBtn");
  payBtn.disabled = false;
  payBtn.innerHTML = `<i class="fa-solid fa-credit-card"></i> Pay Now`;
};

// ========== CRITICAL: Pay Now triggers dynamic form submission to deposit.php ==========
document.getElementById("payNowBtn").onclick = async (e) => {
  const payBtn = document.getElementById("payNowBtn");
  // Prevent double submission
  if (payBtn.disabled) return;
  
  // Validate amount & auth token
  if (!selectedAmount || selectedAmount <= 0) {
    showErrorMessage("Invalid amount selected. Please choose again.");
    return;
  }
  
  if (!currentIdToken && currentUser) {
    try {
      currentIdToken = await currentUser.getIdToken(true);
    } catch (tokenErr) {
      showErrorMessage("Unable to refresh authentication. Please logout and login again.");
      return;
    }
  }
  
  if (!currentIdToken) {
    showErrorMessage("Missing authentication. Please login again.");
    return;
  }
  
  // Set loading state on button to prevent double click
  payBtn.disabled = true;
  const originalHtml = payBtn.innerHTML;
  payBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Redirecting...`;
  
  try {
    // 1) Prepare hidden form fields
    const form = document.getElementById("phpDepositForm");
    const amountInput = document.getElementById("formAmount");
    const tokenInput = document.getElementById("formIdToken");
    
    amountInput.value = selectedAmount;
    tokenInput.value = currentIdToken;
    
    // 2) Close modal BEFORE submit to ensure smooth UI & avoid conflicts
    document.getElementById("paymentModal").style.display = "none";
    
    // 3) Submit the form to deposit.php (POST) – this will trigger server-side order creation & redirect to payment gateway
    // No fetch, no extra timeout, no localStorage usage
    form.submit();
    
    // Note: after form.submit(), the browser navigates to deposit.php response
    // The rest of the JS will be unloaded; no further actions needed.
  } catch (err) {
    console.error("Form submit error:", err);
    showErrorMessage("Payment initiation failed. Please try again.");
    payBtn.disabled = false;
    payBtn.innerHTML = originalHtml;
    // If modal was closed but error occurs, show modal again? just display error
    document.getElementById("paymentModal").style.display = "flex";
  }
};

// Back button
document.getElementById("backButton").onclick = () => {
  window.history.back();
};

// In case user closes modal without issues, ensure payNow button can be re-enabled if needed
window.addEventListener('click', (event) => {
  const modal = document.getElementById("paymentModal");
  if (event.target === modal) {
    modal.style.display = "none";
    const payBtn = document.getElementById("payNowBtn");
    if (payBtn) payBtn.disabled = false;
  }
});

// Optional: ensure that if the page gets stuck but still no fetch usage
console.log("Deposit UI ready — uses POST to deposit.php, no Node payment API, no localStorage order_id");
</script>
</body>
</html>
