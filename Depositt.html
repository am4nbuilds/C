<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Deposit - ElitePros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <!-- Cashfree JS SDK (production ready) -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
    :root {
        --bg-dark: #0b1020;
        --card-bg: #1f2340;
        --card-dark: #121322;
        --accent: #3f3ef2;
        --muted: #9aa3b2;
        --success: #10b981;
        --warning: #f59e0b;
        --deposit-color: #f59e0b;
        --winnings-color: #10b981;
        --balance-color: #3f3ef2;
    }
    
    body {
        background: var(--bg-dark);
        color: white;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        margin: 0;
        padding: 0;
        padding-bottom: 20px;
    }
    
    /* Header - Like Wallet Page */
    .header-bar {
        background: var(--card-dark);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        position: relative;
    }

    .centered-logo-inline-container {
        display: flex;
        align-items: center;
        gap: 12px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }

    .app-logo-header {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(99, 102, 241, 0.5);
        flex-shrink: 0;
    }

    .centered-logo-inline-label {
        font-weight: 800;
        font-size: 18px;
        background: linear-gradient(135deg, #fff, #a5b4fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        white-space: nowrap;
    }

    .back-btn {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        flex-shrink: 0;
    }

    .back-btn:hover {
        background: rgba(255, 255, 255, 0.15);
    }
    
    /* Messages */
    .message-container {
        padding: 0 16px;
        margin-top: 12px;
    }
    
    .error-message,
    .success-message {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        margin-bottom: 12px;
        animation: slideIn 0.3s ease;
    }
    
    .error-message {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
    }
    
    .success-message {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #4ade80;
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Deposit Section */
    .deposit-section {
        padding: 16px;
    }
    
    .deposit-card {
        background: linear-gradient(135deg, var(--card-bg), var(--card-dark));
        border-radius: 20px;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .deposit-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
    }
    
    .deposit-icon {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--warning), #d97706);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
    }
    
    .deposit-header-text {
        flex: 1;
    }
    
    .deposit-title {
        font-weight: 800;
        font-size: 22px;
        margin-bottom: 4px;
    }
    
    .deposit-subtitle {
        color: var(--muted);
        font-size: 14px;
    }
    
    /* Deposit Amounts Grid */
    .deposit-amounts-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 24px;
    }
    
    .deposit-amount-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 20px 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        user-select: none;
    }
    
    .deposit-amount-card:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-2px);
    }
    
    .deposit-amount-card.selected {
        background: linear-gradient(135deg, var(--warning), #d97706);
        border-color: transparent;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
    }
    
    .amount-display {
        font-weight: 800;
        font-size: 24px;
        margin-bottom: 6px;
    }
    
    .amount-bonus {
        font-size: 12px;
        color: var(--muted);
    }
    
    .deposit-amount-card.selected .amount-bonus {
        color: white;
        opacity: 0.9;
    }
    
    /* Skeleton Loading */
    .skeleton-shimmer {
        background: linear-gradient(90deg, 
            rgba(255, 255, 255, 0.05) 25%, 
            rgba(255, 255, 255, 0.1) 50%, 
            rgba(255, 255, 255, 0.05) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 14px;
    }
    
    .skeleton-deposit-amount {
        height: 100px;
    }
    
    @keyframes shimmer {
        0% {
            background-position: -200% 0;
        }
        100% {
            background-position: 200% 0;
        }
    }
    
    /* Deposit Button */
    .deposit-btn-container {
        padding: 16px;
        padding-bottom: 30px;
    }
    
    .deposit-btn {
        width: 100%;
        background: linear-gradient(135deg, var(--accent), #6366f1);
        border: none;
        border-radius: 14px;
        padding: 20px;
        color: white;
        font-weight: 700;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .deposit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
    }
    
    .deposit-btn:not(:disabled):hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(63, 62, 242, 0.3);
    }
    
    .deposit-btn.glow {
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0%, 100% {
            box-shadow: 0 0 20px rgba(63, 62, 242, 0.5);
        }
        50% {
            box-shadow: 0 0 30px rgba(63, 62, 242, 0.8);
        }
    }
    
    /* Payment Modal - modern clean */
    .payment-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        display: none;
    }

    .payment-modal-content {
        background: linear-gradient(135deg, #1f2340, #121322);
        border-radius: 28px;
        padding: 24px;
        width: 90%;
        max-width: 400px;
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .modal-title {
        font-weight: 800;
        font-size: 20px;
        color: white;
    }

    .close-modal {
        background: none;
        border: none;
        color: #9ca3af;
        font-size: 1.8rem;
        cursor: pointer;
        transition: color 0.2s ease;
        line-height: 1;
    }

    .close-modal:hover {
        color: white;
    }

    .payment-amount-display {
        text-align: center;
        margin-bottom: 24px;
    }

    .payment-label {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 8px;
    }

    .payment-value {
        font-weight: 800;
        font-size: 36px;
        color: #f59e0b;
    }

    .payment-instructions {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 24px;
    }

    .instruction-item {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 13px;
        color: #e5e7eb;
    }

    .instruction-item:last-child {
        margin-bottom: 0;
    }

    .instruction-number {
        width: 26px;
        height: 26px;
        border-radius: 30px;
        background: #f59e0b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
    }

    .payment-status {
        text-align: center;
        padding: 16px;
        border-radius: 16px;
        margin-bottom: 20px;
        display: none;
    }

    .payment-status.success {
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .payment-status.error {
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .payment-status i {
        font-size: 2rem;
        margin-bottom: 8px;
    }

    .payment-status.success i {
        color: #22c55e;
    }

    .payment-status.error i {
        color: #ef4444;
    }

    .modal-actions {
        display: flex;
        gap: 12px;
    }

    .modal-btn {
        flex: 1;
        padding: 14px;
        border-radius: 40px;
        border: none;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .modal-btn.primary {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .modal-btn.primary:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    .modal-btn.primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
    }
    </style>
</head>

<body>

        <!-- Centered Logo + Label Container (Inline) -->

            <div class="app-logo-header">
                <img id="appLogo" src="http://elitepros.wuaze.com/IMG-20250106-WA0000.jpg" alt="ElitePros" style="width:100%;height:100%;object-fit:cover;">

                <div class="instruction-item">
                    <div class="instruction-number">1</div>

                <!-- Payment status messages will be shown here -->

<script>
/* =====================================
   FIREBASE INITIALIZATION (AUTH ONLY)
   ===================================== */
const firebaseConfig = {
  apiKey: "AIzaSyC86fii3isDnSOof71h_18PdZehzCEFIFw",
  authDomain: "eliteprosofficial.firebaseapp.com",
  databaseURL: "https://eliteprosofficial-default-rtdb.firebaseio.com",
  projectId: "eliteprosofficial",
  storageBucket: "eliteprosofficial.firebasestorage.app",
  messagingSenderId: "646561207100",
  appId: "1:646561207100:web:47de7b648695367e208439"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

/* =====================================
   GLOBAL STATE
   ===================================== */
let currentUser = null;
let currentUserIdToken = null;
let selectedAmount = 0;
let cashfreeInstance = null;

/* =====================================
   Helper UI messages
   ===================================== */
function showErrorMessage(msg) {
    const errorDiv = document.getElementById("errorMessage");
    document.getElementById("errorText").innerText = msg;
    errorDiv.style.display = "flex";
    setTimeout(() => { errorDiv.style.display = "none"; }, 5000);
}

function showSuccessMessage(msg) {
    const successDiv = document.getElementById("successMessage");
    document.getElementById("successText").innerText = msg;
    successDiv.style.display = "flex";
    setTimeout(() => { successDiv.style.display = "none"; }, 5000);
}

/* =====================================
   AUTH CHECK & LOAD DEPOSIT OPTIONS
   ===================================== */
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  currentUser = user;
  try {
    currentUserIdToken = await user.getIdToken();
  } catch (error) {
    console.error("Error getting ID token:", error);
    showErrorMessage("Authentication error. Please refresh the page.");
    return;
  }
  await loadDepositAmounts();
});

/* =====================================
   LOAD DEPOSIT AMOUNTS FROM BACKEND API
   ===================================== */
async function loadDepositAmounts() {
  try {
    if (!currentUserIdToken) throw new Error("No auth token");
    const response = await fetch("https://elitepros-backend.onrender.com/api/deposit-options", {
      method: "GET",
      headers: { 
        "Authorization": `Bearer ${currentUserIdToken}`,
        "Content-Type": "application/json"
      }
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    let amounts = [];
    if (Array.isArray(data)) amounts = data.filter(a => typeof a === 'number' && a > 0);
    else if (data.amounts && Array.isArray(data.amounts)) amounts = data.amounts.filter(a => typeof a === 'number' && a > 0);
    else if (data.data && Array.isArray(data.data)) amounts = data.data.filter(a => typeof a === 'number' && a > 0);
    
    amounts.sort((a,b) => a - b);
    if (amounts.length === 0) amounts = [100, 250, 500, 1000];
    displayDepositAmounts(amounts);
  } catch (error) {
    console.error("Error loading deposit amounts, using defaults:", error);
    showDefaultDepositAmounts();
  }
}

function displayDepositAmounts(amounts) {
  const container = document.getElementById('depositAmountsGrid');
  container.innerHTML = '';
  amounts.forEach((amount) => {
    const amountCard = document.createElement('div');
    amountCard.className = 'deposit-amount-card';
    amountCard.dataset.amount = amount;
    amountCard.onclick = () => selectAmount(amount);
    amountCard.innerHTML = `
      <div class="amount-display">₹${amount}</div>
      <div class="amount-bonus">Instant Deposit</div>
    `;
    container.appendChild(amountCard);
  });
  document.getElementById('depositAmountsLoading').style.display = 'none';
  document.getElementById('depositAmountsContent').style.display = 'block';
}

function showDefaultDepositAmounts() {
  displayDepositAmounts([100, 250, 500, 1000]);
}

function selectAmount(amount) {
  selectedAmount = amount;
  document.querySelectorAll(".deposit-amount-card").forEach(card => {
    const cardAmount = parseInt(card.dataset.amount);
    card.classList.toggle("selected", cardAmount === amount);
  });
  const btn = document.getElementById("depositBtn");
  btn.disabled = false;
  btn.classList.add("glow");
  btn.innerHTML = `<i class="fa-solid fa-credit-card"></i> Pay ₹${selectedAmount}`;
}

function updateDepositButton() {} // handled by selectAmount

/* =====================================
   BACK BUTTON
   ===================================== */
document.getElementById("backButton").onclick = () => window.history.back();

/* =====================================
   MODAL OPEN (before checkout)
   ===================================== */
document.getElementById("depositBtn").onclick = () => {
  if (!selectedAmount) {
    alert("Please select an amount first");
    return;
  }
  // reset modal UI
  document.getElementById("paymentAmountValue").innerText = `₹${selectedAmount}`;
  const statusDiv = document.getElementById("paymentStatus");
  statusDiv.style.display = "none";
  statusDiv.innerHTML = "";
  document.getElementById("paymentModal").style.display = "flex";
};

/* =====================================
   CASHFREE SESSION-BASED PAYMENT (NEW ENDPOINT)
   Removed: AbortController, localStorage usage, timeout logic, payment_url redirect
   Uses: /create-payment-test to get payment_session_id, then Cashfree SDK checkout
   ===================================== */
document.getElementById("payNowBtn").onclick = async () => {
  if (!selectedAmount || !currentUserIdToken) {
    showErrorMessage("Missing amount or authentication. Please try again.");
    return;
  }

  const btn = document.getElementById("payNowBtn");
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Creating session...`;

  // Hide any previous status
  const statusDiv = document.getElementById("paymentStatus");
  statusDiv.style.display = "none";
  statusDiv.innerHTML = "";

  try {
    // 1) Call new /create-payment-test endpoint (returns payment_session_id)
    const response = await fetch("https://elitepros-backend.onrender.com/create-payment-test", {
      method: "POST",
      headers: { 
        "Content-Type": "application/json",
        "Authorization": `Bearer ${currentUserIdToken}`
      },
      body: JSON.stringify({
        amount: selectedAmount,
        timestamp: Date.now()
      })
    });

    if (!response.ok) {
      let errMsg = `Server error (${response.status})`;
      try {
        const errData = await response.json();
        errMsg = errData.message || errMsg;
      } catch(e) {}
      throw new Error(errMsg);
    }

    const data = await response.json();
    // Expecting { payment_session_id: "session_xxx", ... } from backend
    if (!data.payment_session_id) {
      throw new Error("Invalid response from payment server: missing payment_session_id");
    }

    const paymentSessionId = data.payment_session_id;
    console.log("Payment session created:", paymentSessionId);

    // 2) Close modal before opening checkout (smooth UX)
    document.getElementById("paymentModal").style.display = "none";
    
    // 3) Initialize Cashfree SDK (if not already)
    // According to Cashfree v3 docs, we use Cashfree(cashfreeConfig) and call checkout()
    // Use production/ sandbox based on backend environment. We'll rely on merchant ID provided via backend but SDK just needs session ID
    // The Cashfree JS SDK loaded via script exposes window.Cashfree
    if (typeof window.Cashfree === 'undefined') {
      throw new Error("Cashfree SDK not loaded. Please check internet connection.");
    }
    
    // Create cashfree instance (global merchant config can be empty, session drives the payment)
    // Recommended: pass proper environment from backend, but we can detect based on payment_session_id pattern.
    // Use sandbox for testing else production; defaulting to production but can be overridden.
    // The SDK expects cashfree instance with merchantId, but for session-based checkout, only session ID is required.
    // According to Cashfree docs v3: const cashfree = new Cashfree(environment, merchantId);
    // However for session checkout, we use cashfree.checkout({ paymentSessionId }). We'll fetch merchant details from env or keep generic.
    // We'll initialize with production environment; backend should return session accordingly. If fails, fallback to sandbox.
    let cashfreeEnv = "production";
    // You can check if session starts with 'sandbox' pattern; but safer to use same as backend.
    if (paymentSessionId && paymentSessionId.toLowerCase().includes('sandbox')) cashfreeEnv = "sandbox";
    // Merchant ID is required by constructor; we can use placeholder (the session overrides). Provide dummy but valid merchant ID.
    // Real merchant ID must be consistent with your Cashfree account. We'll use your registered merchant id or let the backend define.
    // In Cashfree v3, if using session-based checkout, we need to call Cashfree(environment, merchantId). 
    // Merchant ID should match the one that created the session. For demo we use a generic one, but it's better to fetch from backend or config.
    // To avoid merchant ID mismatch, you may set merchant ID as "MERCHANT123" but actual must be same as backend. 
    // We'll use a placeholder; if it fails, we inform user. The backend should return correct merchant ID or we store it.
    // For simplicity and to reduce config, I'll assume the merchant ID is set globally from backend or we read from meta.
    // Let's try to instantiate with merchant ID that's consistent with your Cashfree account. If issues, we'll fetch from config endpoint.
    // In many implementations, you can instantiate with a dummy and session ID still works if merchant matches backend session creation.
    // Safer: fetch merchantId from backend config if needed. But for robust, we store from first config (hardcoded recommended merchantId)
    // Replace with your actual merchant ID. Use the one used on /create-payment-test. 
    // The best approach: retrieve merchant ID from response or environment variable. I'll use an environment variable approach.
    const merchantId = "YOUR_MERCHANT_ID"; // Replace with actual merchant id used in backend
    // For safety we can extract from payment_session_id? Not reliable. Instead we check if backend returns merchant_id.
    let effectiveMerchantId = merchantId;
    if (data.merchant_id) effectiveMerchantId = data.merchant_id;
    
    // Instantiate Cashfree
    const cashfree = new window.Cashfree(cashfreeEnv, effectiveMerchantId);
    
    // 4) Open checkout with payment_session_id
    const checkoutOptions = {
      paymentSessionId: paymentSessionId,
      redirectTarget: "_modal", // or "_self", but we want inline modal experience, using "_modal" is default
      // optional: onSuccess, onFailure callbacks
    };
    
    // Trigger checkout (this opens native Cashfree payment sheet / modal)
    await cashfree.checkout(checkoutOptions);
    
    // After checkout modal closes, we can notify user but status handled by webhooks/redirects.
    // We'll just show a success indicator (actual balance will update via backend).
    showSuccessMessage("Payment initiated! Funds will reflect shortly after completion.");
    // Reset button state (modal already closed)
    btn.disabled = false;
    btn.innerHTML = originalHTML;
    
  } catch (error) {
    console.error("Cashfree checkout error:", error);
    // Re-open modal to show error
    document.getElementById("paymentModal").style.display = "flex";
    statusDiv.className = "payment-status error";
    let friendlyMsg = error.message || "Payment session creation failed. Please try again.";
    if (friendlyMsg.includes("merchant")) friendlyMsg = "Payment configuration error. Contact support.";
    statusDiv.innerHTML = `
      <i class="fas fa-times-circle"></i>
      <div style="font-weight: bold; margin-bottom: 5px;">Checkout Failed</div>
      <div>${friendlyMsg}</div>
    `;
    statusDiv.style.display = "block";
    // reset button
    btn.disabled = false;
    btn.innerHTML = originalHTML;
    showErrorMessage(friendlyMsg);
  }
};

/* =====================================
   CLOSE MODAL
   ===================================== */
document.getElementById("closeModal").onclick = () => {
  document.getElementById("paymentModal").style.display = "none";
  const btn = document.getElementById("payNowBtn");
  btn.disabled = false;
  btn.innerHTML = `<i class="fa-solid fa-credit-card"></i> Proceed to Pay`;
  const statusDiv = document.getElementById("paymentStatus");
  statusDiv.style.display = "none";
};
</script>
