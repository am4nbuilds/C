  /* Loading & states */
  .loading-spinner {

    }
    .pos-badge { width: 32px; height: 32px; }
    .match-id-badge { font-size: 10px; padding: 3px 8px; }
  }

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script>
  // ----------------------------- FIREBASE CONFIG -----------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyC86fii3isDnSOof71h_18PdZehzCEFIFw",
    authDomain: "eliteprosofficial.firebaseapp.com",
    databaseURL: "https://eliteprosofficial-default-rtdb.firebaseio.com",
    projectId: "eliteprosofficial",
    storageBucket: "eliteprosofficial.firebasestorage.app",
    messagingSenderId: "646561207100",
    appId: "1:646561207100:web:47de7b648695367e208439",
    measurementId: "G-ZN5VNFCSEL"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Backend endpoint base
  const BACKEND_URL = "https://elitepros-backend.onrender.com";

  // Get URL parameters
  const urlParams = new URLSearchParams(window.location.search);
  const matchId = urlParams.get('matchId');
  const statusParam = urlParams.get('status');

  // Helper: go back
  function goBack() {
    if (document.referrer) window.history.back();
    else window.location.href = 'tournaments.html';
  }

  // Show matchId in header with strict string safety
  if (matchId) {
    const matchIdSpan = document.getElementById('matchIdDisplay');
    const safeMatchId = String(matchId || "");
    if (matchIdSpan) matchIdSpan.innerText = safeMatchId.length > 12 ? safeMatchId.slice(0,12)+'…' : safeMatchId;
  }

  // ----- SAFE STRING UTILITIES (FULL COERCION) -----
  function safeString(value, fallback = '') {
    if (value === undefined || value === null) return fallback;
    if (typeof value === 'string') return value;
    if (typeof value === 'number' || typeof value === 'boolean') return String(value);
    try {
      return JSON.stringify(value);
    } catch(e) {
      return fallback;
    }
  }

  function safeNumber(value, fallback = 0) {
    if (value === undefined || value === null) return fallback;
    const num = Number(value);
    return isNaN(num) ? fallback : num;
  }

  // Enhanced escapeHtml with guaranteed string input
  function escapeHtml(raw) {
    let str = safeString(raw, '');
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // Safely get player IGN from players object (players[uid] might be object with .ign or direct string)
  function getPlayerIgn(playersObj, uid, defaultName = 'Unknown Player') {
    if (!playersObj || uid === undefined || uid === null) return defaultName;
    const playerData = playersObj[uid];
    if (playerData === undefined || playerData === null) return defaultName;
    // if playerData is object and has ign property, use that, else if it's string use it, else convert
    if (typeof playerData === 'object') {
      const ignVal = playerData.ign !== undefined ? playerData.ign : playerData.displayName;
      return safeString(ignVal, defaultName);
    }
    return safeString(playerData, defaultName);
  }

  // ---------------------- CORE LEADERBOARD BUILDER (NO STRING METHOD ON RAW VALUES) -----------------
  function buildLeaderboardFromApi(apiData) {
    // Guard: ensure apiData and results exist
    if (!apiData || !apiData.results) return [];
    const results = apiData.results;
    const players = apiData.players || {};
    
    // Safely extract sub-objects
    const placements = results.placements && typeof results.placements === 'object' ? results.placements : {};
    const kills = results.kills && typeof results.kills === 'object' ? results.kills : {};
    const rankPrizes = results.rankPrizes && typeof results.rankPrizes === 'object' ? results.rankPrizes : {};
    const totalWinnings = results.totalWinnings && typeof results.totalWinnings === 'object' ? results.totalWinnings : {};
    const perKill = safeNumber(apiData.matchDetails?.perKill, 0);
    
    const resultsMap = new Map(); // uid -> player entry

    // 1. Process placements (ranks)
    Object.entries(placements).forEach(([rankKey, uidRaw]) => {
      if (uidRaw === undefined || uidRaw === null) return;
      const uid = safeString(uidRaw, '');
      if (!uid) return;
      // Extract rank number from rankKey (e.g., "rank_1") -> strictly using safeString + replace
      const safeRankKey = safeString(rankKey, '');
      const rankNumMatch = safeRankKey.replace(/[^\d]/g, '');
      let position = 999;
      const parsedRank = parseInt(rankNumMatch, 10);
      if (!isNaN(parsedRank)) position = parsedRank;
      
      const rankPrizeVal = safeNumber(rankPrizes[uid], 0);
      const killCount = safeNumber(kills[uid], 0);
      const killWinnings = killCount * perKill;
      const totalWinVal = safeNumber(totalWinnings[uid], rankPrizeVal + killWinnings);
      
      resultsMap.set(uid, {
        uid: uid,
        position: position,
        rankWinnings: rankPrizeVal,
        kills: killCount,
        killWinnings: killWinnings,
        totalWinnings: totalWinVal,
        ign: getPlayerIgn(players, uid, 'Unknown Player')
      });
    });

    // 2. Process kills for players not in placements
    Object.entries(kills).forEach(([uidRaw, killCountRaw]) => {
      const uid = safeString(uidRaw, '');
      if (!uid) return;
      const killCount = safeNumber(killCountRaw, 0);
      if (!resultsMap.has(uid)) {
        const rankPrizeVal = safeNumber(rankPrizes[uid], 0);
        const killWinnings = killCount * perKill;
        const totalWinVal = safeNumber(totalWinnings[uid], rankPrizeVal + killWinnings);
        resultsMap.set(uid, {
          uid: uid,
          position: 999,
          rankWinnings: rankPrizeVal,
          kills: killCount,
          killWinnings: killWinnings,
          totalWinnings: totalWinVal,
          ign: getPlayerIgn(players, uid, 'Unknown Player')
        });
      } else {
        const existing = resultsMap.get(uid);
        if (existing.kills === 0 && killCount > 0) {
          existing.kills = killCount;
          existing.killWinnings = killCount * perKill;
          existing.totalWinnings = existing.rankWinnings + existing.killWinnings;
          resultsMap.set(uid, existing);
        }
      }
    });

    // 3. Process rankPrizes only for missing players
    Object.entries(rankPrizes).forEach(([uidRaw, prizeRaw]) => {
      const uid = safeString(uidRaw, '');
      if (!uid) return;
      if (!resultsMap.has(uid)) {
        const killCount = safeNumber(kills[uid], 0);
        const killWinnings = killCount * perKill;
        const rankPrizeVal = safeNumber(prizeRaw, 0);
        const totalWinVal = safeNumber(totalWinnings[uid], rankPrizeVal + killWinnings);
        resultsMap.set(uid, {
          uid: uid,
          position: 999,
          rankWinnings: rankPrizeVal,
          kills: killCount,
          killWinnings: killWinnings,
          totalWinnings: totalWinVal,
          ign: getPlayerIgn(players, uid, 'Unknown Player')
        });
      }
    });

    // 4. Process totalWinnings for any stragglers
    Object.entries(totalWinnings).forEach(([uidRaw, winRaw]) => {
      const uid = safeString(uidRaw, '');
      if (!uid) return;
      if (!resultsMap.has(uid)) {
        const killCount = safeNumber(kills[uid], 0);
        const killWinnings = killCount * perKill;
        const rankPrizeVal = safeNumber(rankPrizes[uid], 0);
        resultsMap.set(uid, {
          uid: uid,
          position: 999,
          rankWinnings: rankPrizeVal,
          kills: killCount,
          killWinnings: killWinnings,
          totalWinnings: safeNumber(winRaw, rankPrizeVal + killWinnings),
          ign: getPlayerIgn(players, uid, 'Unknown Player')
        });
      }
    });

    // Convert to array and sort
    let leaderboard = Array.from(resultsMap.values());
    leaderboard.sort((a, b) => {
      if (a.position !== b.position) return a.position - b.position;
      return b.totalWinnings - a.totalWinnings;
    });
    return leaderboard;
  }

  // Render leaderboard rows with full safe string/ number handling
  function renderLeaderboard(leaderboardData, container) {
    if (!leaderboardData || leaderboardData.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-users-slash"></i>
          <h3>No Results Available</h3>
          <p>No player data found for this completed match.</p>
        </div>`;
      return;
    }

    container.innerHTML = '';
    leaderboardData.forEach((player, idx) => {
      let displayPos = safeNumber(player.position, 999);
      if (displayPos === 999) displayPos = idx + 1;
      const posClass = displayPos === 1 ? 'pos-1' : displayPos === 2 ? 'pos-2' : displayPos === 3 ? 'pos-3' : 'pos-other';
      const winningsNum = safeNumber(player.totalWinnings, 0);
      const winningsFormatted = winningsNum > 0 ? `₹${Math.round(winningsNum).toLocaleString()}` : '₹0';
      const killsCount = safeNumber(player.kills, 0);
      const ignRaw = safeString(player.ign, 'Anonymous');
      const ignSanitized = escapeHtml(ignRaw);
      const uidSafe = encodeURIComponent(safeString(player.uid, ''));
      
      const row = document.createElement('div');
      row.className = 'leaderboard-row';
      row.innerHTML = `
        <div class="col-pos"><div class="pos-badge ${posClass}">${displayPos}</div></div>
        <div class="col-name">${ignSanitized}</div>
        <div class="col-winnings">${winningsFormatted}</div>
        <div class="col-kills">${killsCount}</div>
        <div class="col-view view-profile"><a href="view-profile.html?uid=${uidSafe}"><i class="fa-solid fa-eye"></i></a></div>
      `;
      container.appendChild(row);
    });
  }

  // Fetch match results with token
  async function fetchMatchResults(token, matchIdParam, status) {
    const safeStatus = safeString(status, '');
    if (safeStatus !== 'completed') {
      throw new Error('STATUS_NOT_COMPLETED');
    }
    const safeMatchId = encodeURIComponent(safeString(matchIdParam, ''));
    const url = `${BACKEND_URL}/match-results?matchId=${safeMatchId}&status=completed`;
    const response = await fetch(url, {
      method: 'GET',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      }
    });
    if (!response.ok) {
      let errorMsg = `HTTP ${response.status}`;
      if (response.status === 404) errorMsg = 'Match results not found.';
      else if (response.status === 401) errorMsg = 'Unauthorized. Please login again.';
      else if (response.status === 403) errorMsg = 'Access denied.';
      const errBody = await response.text().catch(() => '');
      throw new Error(`${errorMsg} ${errBody}`);
    }
    const data = await response.json();
    if (!data.results || !data.players) {
      throw new Error('Invalid API response structure');
    }
    return data;
  }

  // Pending results UI when match not completed
  function renderPendingResults() {
    const leaderboardContainer = document.getElementById('leaderboard-rows');
    const notesContainer = document.getElementById('matchNotesContainer');
    if (notesContainer) notesContainer.style.display = 'none';
    if (leaderboardContainer) {
      leaderboardContainer.innerHTML = `
        <div class="empty-state" style="padding: 70px 20px;">
          <i class="fa-regular fa-clock fa-3x"></i>
          <h3>Results will be available after match completion</h3>
          <p>Check back once the match status changes to "completed".</p>
          <button onclick="goBack()" class="mt-4 px-5 py-2 bg-indigo-600 rounded-xl text-sm font-semibold hover:bg-indigo-500 transition" style="background:#3f3ef2; border:none;">← Back to Tournaments</button>
        </div>`;
    }
  }

  // Show error state
  function showErrorState(container, message, isCritical = true) {
    const safeMsg = escapeHtml(safeString(message, 'Unknown error.'));
    container.innerHTML = `
      <div class="error-state">
        <i class="fa-solid fa-exclamation-triangle"></i>
        <h3>Error Loading Results</h3>
        <p>${safeMsg}</p>
        <button onclick="window.location.reload()" class="mt-4 px-4 py-2 bg-gray-700 rounded-lg text-sm">Retry</button>
      </div>`;
  }

  // Main flow: authentication and data loading
  async function loadMatchResultsFlow() {
    const leaderboardContainer = document.getElementById('leaderboard-rows');
    const notesContainer = document.getElementById('matchNotesContainer');
    const notesTextElem = document.getElementById('matchNotes');
    
    const safeMatchId = safeString(matchId, '');
    if (!safeMatchId) {
      if (leaderboardContainer) {
        leaderboardContainer.innerHTML = `
          <div class="error-state">
            <i class="fa-solid fa-link-slash"></i>
            <h3>Match ID Missing</h3>
            <p>Invalid URL. No match ID provided.</p>
          </div>`;
      }
      return;
    }

    const safeStatus = safeString(statusParam, '');
    if (safeStatus !== 'completed') {
      renderPendingResults();
      return;
    }

    if (leaderboardContainer) {
      leaderboardContainer.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
    }
    if (notesContainer) notesContainer.style.display = 'none';

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'home.html';
        return;
      }
      try {
        const token = await user.getIdToken(true);
        const apiResponse = await fetchMatchResults(token, safeMatchId, safeStatus);
        
        // Extract match notes with safety
        const matchNotesRaw = apiResponse.results?.matchNotes;
        const matchNotesText = safeString(matchNotesRaw, '');
        if (matchNotesText && matchNotesText.trim() !== '') {
          if (notesContainer) notesContainer.style.display = 'block';
          if (notesTextElem) notesTextElem.innerHTML = escapeHtml(matchNotesText);
        } else {
          if (notesContainer) notesContainer.style.display = 'none';
        }
        
        const leaderboardEntries = buildLeaderboardFromApi(apiResponse);
        if (leaderboardContainer) renderLeaderboard(leaderboardEntries, leaderboardContainer);
      } catch (err) {
        console.error('[MatchResults] Error:', err);
        let friendlyMsg = safeString(err.message, 'Failed to load match results.');
        if (friendlyMsg.includes('STATUS_NOT_COMPLETED')) {
          renderPendingResults();
          return;
        }
        if (friendlyMsg.includes('404')) friendlyMsg = 'Match not found or results not published.';
        if (friendlyMsg.includes('NetworkError') || friendlyMsg.includes('fetch')) friendlyMsg = 'Network error. Please check your connection.';
        if (leaderboardContainer) showErrorState(leaderboardContainer, friendlyMsg);
        if (notesContainer) notesContainer.style.display = 'none';
      }
    });
  }

  // Start the page after ensuring everything is defined
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadMatchResultsFlow);
  } else {
    loadMatchResultsFlow();
  }
</script>
</body>
</html>
